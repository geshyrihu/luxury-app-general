name: checador_empleado
description: App de registro de asistencia para empleados de LuxuryApp.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── Red ────────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1
  connectivity_plus: ^6.1.3

  # ── Estado ─────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Serialización ───────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Seguridad y sesión ──────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  jwt_decoder: ^2.0.1

  # ── Navegación ───────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Utilidades funcionales ───────────────────────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7

  # ── GPS ─────────────────────────────────────────────────────────────────────
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # ── Cámara (solo cámara — galería bloqueada por regla de negocio) ───────────
  image_picker: ^1.1.2

  # ── UI ──────────────────────────────────────────────────────────────────────
  cherry_toast: ^1.10.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  retrofit_generator: ^9.1.6
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
