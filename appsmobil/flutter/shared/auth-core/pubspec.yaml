name: auth_core
description: Paquete compartido de autenticación, sesión y red para apps Flutter de LuxuryApp.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── Red ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.4

  # ── Serialización ───────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Estado (Riverpod) ───────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Seguridad / JWT ─────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1

  # ── Conectividad ────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.1

  # ── Funcional ───────────────────────────────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7

  # ── Notificaciones push ─────────────────────────────────────────────────
  onesignal_flutter: ^5.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Generadores ────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
