      <img class="for-dark" src="assets/images/other-images/logo-light.png" alt="" />
      <h5>WE ARE COMING SOON</h5>
      <div class="countdown">
        <ul>
          <li><span class="days time" id="day"></span><span class="title">days</span></li>
