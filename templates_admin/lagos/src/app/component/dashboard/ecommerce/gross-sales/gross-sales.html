<div class="card best-seller">
  <div class="card-header pb-0 card-no-border">
    <div class="header-top">
      <h4>Gross Sales </h4>
      <div class="dropdown icon-dropdown" (clickOutside)="outSide()">
        <button class="btn dropdown-toggle" type="button" [class.show]="isShow" (click)="isShow =!isShow">
          <i class="icon-more-alt"></i></button>
        <div class="dropdown-menu dropdown-menu-end" [class.show]="isShow"
          style="position: absolute;inset: 0px 0px auto auto;margin: 0px;transform: translate(0px, 23px);">
          <a class="dropdown-item" href="javascript:Void(0)">Weekly</a>
          <a class="dropdown-item" href="javascript:Void(0)">Monthly</a>
          <a class="dropdown-item" href="javascript:Void(0)">Yearly</a>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body pt-0">
    <div class="table-responsive theme-scrollbar">
      <div class="dataTables_wrapper no-footer">
        <table class="table display dataTable no-footer" id="selling-product" style="width:100%">
          <thead>
            <tr>
              <th>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="">
                  <label class="form-check-label"></label>
                </div>
              </th>
              <th>Name</th>
              <th>Date</th>
              <th>Product</th>
              <th>Country</th>
              <th>Total</th>
              <th>Status</th>
              <th>Edit</th>
            </tr>
          </thead>
          <tbody>
            @for (item of grossSales; track item) {
            <tr>
              <td>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="">
                  <label class="form-check-label"></label>
                </div>
              </td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="flex-shrink-0"><img class="img-fluid" [src]="item.image" alt=""></div>
                  <div class="flex-grow-1"><span class="f-14 f-w-600"> 
                    <a [routerLink]="['/user/users-profile']">{{item.name}}</a></span>
                    <p class="mb-0">{{item.year}}</p>
                  </div>
                  <div class="active-status active-online"></div>
                </div>
              </td>
              <td>{{item.date}}</td>
              <td>{{item.product}}</td>
              <td> <i class="flag-icon flag-icon-{{item.flag}}"></i></td>
              <td> <span>{{item.total}}</span></td>
              <td> <span>{{item.status}}</span><i class="fa fa-check-circle f-14"></i></td>
              <td><span> <a [routerLink]="['/user/edit-profile']">Edit</a></span></td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
