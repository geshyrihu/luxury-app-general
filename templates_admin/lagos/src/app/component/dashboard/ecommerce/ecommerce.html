<div class="container-fluid dashboard-2">
  <div class="row">
    @for (item of topChart; track item) {
    <div class="col-xl-3 col-sm-6">
      <app-top-charts [data]="item" />
    </div>
    }
    <div class="col-xxl-7 box-col-12">
      <app-gross-sales />
    </div>
    <div class="col-xxl-5 col-md-6 box-col-6">
      <app-order-activity />
    </div>
    <div class="col-xxl-4 col-md-6 box-col-6">
      <app-core-categories />
    </div>
    <div class="col-xxl-5 col-xl-7 box-col-7">
      <app-trending-product />
    </div>
    <div class="col-xxl-3 col-md-5 col-sm-6 box-col-5">
      <app-special-weekend-offer />
    </div>
    <div class="col-xxl-6 col-xl-5 col-md-7 col-sm-6 box-col-5">
      <app-net-income />
    </div>
    <div class="col-xxl-6 col-xl-7 box-col-7">
      <app-open-invoices />
    </div>
  </div>
</div>
